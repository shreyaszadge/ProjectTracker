<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dev Workbench</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Inter:wght@400;500&display=swap">
<style>
:root{--bg:#f4f3f1;--card:#fff;--ink:#1f1d1a;--mute:#6b6560;--line:#e2dfda;--done:#c15f3c;--prog:#b7791f;--track:#e8e4df;--bad:#b42318;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1816;--card:#16231f;--ink:#e8f0ed;--mute:#9bb0aa;--line:#26372f;--done:#2dd4bf;--prog:#f5b83d;--track:#233630;--bad:#f97066;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Inter,system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font:700 28px/1.15 "Bricolage Grotesque",Inter,sans-serif;margin:8px 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:8px 0 16px}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);padding:8px 12px;font:500 16px "Bricolage Grotesque",Inter,sans-serif;cursor:pointer}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--done)}
.sum,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.big{font:700 36px/1 "Bricolage Grotesque",Inter,sans-serif}
.bar{height:10px;background:var(--track);border-radius:99px;overflow:hidden;margin:12px 0 8px}
.bar i{display:block;height:100%;background:var(--done);transition:width .3s}
.meta{color:var(--mute);font-size:14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.next{margin-top:10px;font-size:15px}
.step{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:10px;margin-bottom:10px}
.step[data-s=prog]{border-left-color:var(--prog)}
.step[data-s=done]{border-left-color:var(--done)}
.head{width:100%;display:flex;align-items:center;gap:12px;padding:14px;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.n{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:700 14px "Bricolage Grotesque",Inter,sans-serif}
.step[data-s=prog] .n{border-color:var(--prog);color:var(--prog)}
.step[data-s=done] .n{background:var(--done);border-color:var(--done);color:var(--bg)}
.t{flex:1;font:500 17px/1.3 "Bricolage Grotesque",Inter,sans-serif}
.c{color:var(--mute);font-size:14px;white-space:nowrap}
.body{display:none;padding:0 14px 12px 56px}
.step.open .body{display:block}
.task{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task input[type=checkbox]{width:20px;height:20px;margin:1px 0 0;accent-color:var(--done);flex:none}
.task span{flex:1;cursor:pointer}
.task.on span{color:var(--mute);text-decoration:line-through}
.x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px}
.btn{background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
.btn.pri{background:var(--done);border-color:var(--done);color:var(--bg);font-weight:500}
.btn.bad{color:var(--bad)}
.acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
input[type=text],input[type=search],select,textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit}
select{width:auto;min-width:160px;flex:1}
textarea{resize:vertical;min-height:120px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.fl{display:block;color:var(--mute);font-size:14px;margin:12px 0 4px}
.note{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.note b{font:500 17px "Bricolage Grotesque",Inter,sans-serif}
.note p{margin:4px 0 0;color:var(--mute);font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.chip{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:0 9px;font-size:13px;color:var(--mute);margin:6px 6px 0 0;background:none;cursor:pointer}
.empty{color:var(--mute);padding:16px 0}
.h2{font:700 20px "Bricolage Grotesque",Inter,sans-serif;margin:0 0 10px}
.erbox{overflow-x:auto;border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:8px}
.fr{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.fr input[type=text]{width:auto;flex:2;min-width:110px}
.fr input[type=text].cd{flex:none;width:72px}
.fr select{min-width:0;width:auto;flex:1}
.ck{display:flex;gap:4px;align-items:center;font-size:14px;color:var(--mute)}
.ep{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.en{font:700 20px "Bricolage Grotesque",Inter,sans-serif;flex:1}
main{max-width:1100px}
.sh{font-size:24px;margin:32px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.ngrid .card{margin:0}
.ngrid input,.ngrid textarea{margin-bottom:8px}
.ngrid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
html,body{height:100%;overflow:hidden}
main{max-width:none;margin:0;height:100%;padding:10px 14px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto minmax(0,1fr);gap:0 16px}
h1{margin:0;font-size:22px;align-self:center}
#app{display:contents}
.top{margin:0 0 10px;align-self:center}
.top select{flex:none;width:220px}
.dash{grid-column:1/-1;display:flex;gap:12px;min-height:0}
.col{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.col:nth-child(1){flex:1 1 0}.col:nth-child(2){flex:1.5 1 0}.col:nth-child(3){flex:1 1 0}
.col.cc{flex:0 0 44px}
.pn{flex:1 1 0;min-height:0;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pn.collapsed{flex:0 0 auto}
.col.cc .pn{flex:1 1 0}
.ph{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.ph .h2{flex:1;margin:0;font-size:17px}
.ph .btn{padding:4px 10px}
.pb{flex:1;min-height:0;overflow:auto;padding:12px}
.pb>.sum,.pb>.card{background:var(--bg)}
.pn.collapsed .pb{display:none}
.pn.collapsed .ph{border-bottom:0}
.cc .ph{writing-mode:vertical-rl;padding:12px 8px}
.cc .ph .mx{display:none}
.cc .ph .btn{order:-1}
:root[data-theme="monokai"]{--bg:#1e1f1c;--card:#272822;--ink:#f8f8f2;--mute:#a8a28a;--line:#3e3d32;--done:#d97757;--prog:#fd971f;--track:#3e3d32;--bad:#f92672;color-scheme:dark}
:root[data-theme="monokai"] .mono{color:#e6db74}
:root[data-theme="monokai"] .h2,:root[data-theme="monokai"] .en{color:#66d9ef}
.top select.th{width:120px}
.ecol>:not(.row){display:none}
.epc>:not(.fr){display:none}
#report{display:none}
@media print{
@page{margin:14mm 12mm}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body>*:not(#report){display:none!important}
html,body{height:auto;overflow:visible;background:#fff}
#report{display:block;color:#1f1d1a;font:11.5px/1.5 Inter,system-ui,sans-serif}
.r-cover{background:#c15f3c;color:#fff;border-radius:10px;padding:22px 24px;margin-bottom:14px}
.r-cover h1{font:700 28px/1.15 "Bricolage Grotesque",Inter,sans-serif;margin:0 0 4px;color:#fff;align-self:auto}
.r-cover p{margin:2px 0}
.r-bar{height:8px;background:rgba(255,255,255,.35);border-radius:9px;margin:12px 0 6px;overflow:hidden}
.r-bar i{display:block;height:100%;background:#fff}
#report h2{font:700 18px "Bricolage Grotesque",Inter,sans-serif;color:#c15f3c;margin:22px 0 8px;padding-bottom:4px;border-bottom:2px solid #c15f3c;break-after:avoid}
#report h3{font:700 14px "Bricolage Grotesque",Inter,sans-serif;margin:0}
.r-box{border:1px solid #e2dfda;border-radius:8px;margin:0 0 10px;overflow:hidden}
.r-keep{break-inside:avoid}
.r-bh{background:#f4f3f1;padding:7px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #e2dfda}
.r-bh span{color:#6b6560;font-size:11px}
.r-bb{padding:8px 12px}
#report table{border-collapse:collapse;width:100%}
#report th{background:#f4f3f1;text-align:left;font-size:10.5px;color:#6b6560}
#report td,#report th{padding:4px 8px;border-bottom:1px solid #eceae6}
#report tr:nth-child(even) td{background:#faf9f8}
.r-ep{margin-top:10px;padding-top:8px;border-top:1px dashed #e2dfda;break-inside:avoid}
.r-m{display:inline-block;color:#fff;font:700 10px Inter,sans-serif;padding:1px 8px;border-radius:4px;margin-right:8px;background:#6b6560}
.m-GET{background:#2f7d5b}.m-POST{background:#c15f3c}.m-PUT{background:#b7791f}.m-PATCH{background:#6b5bb3}.m-DELETE{background:#b42318}
.r-path{font:600 12px ui-monospace,Menlo,Consolas,monospace}
.r-st{float:right;color:#6b6560;font-size:11px}
.r-lb{font-size:10px;font-weight:700;color:#6b6560;margin-top:4px}
.r-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#report pre{white-space:pre-wrap;font:10.5px/1.4 ui-monospace,Menlo,Consolas,monospace;background:#f7f6f4;border-left:3px solid #c15f3c;border-radius:0 4px 4px 0;padding:6px 8px;margin:3px 0 6px;break-inside:avoid}
#report svg{max-width:100%;height:auto;border:1px solid #e2dfda;border-radius:8px;padding:4px;margin-bottom:10px}
#report ul{list-style:none;margin:0;padding:0}
#report li{padding:3px 0;border-bottom:1px solid #f0eeea}
.r-ck{display:inline-block;width:12px;height:12px;border:1.5px solid #6b6560;border-radius:3px;margin-right:8px;vertical-align:-2px;text-align:center;line-height:10px;font-size:9px}
.r-ck.on{background:#c15f3c;border-color:#c15f3c;color:#fff}
.r-tag{display:inline-block;background:#f6e4dd;color:#8f3f25;border-radius:99px;padding:0 9px;font-size:10px;margin:0 4px 4px 0}
.r-foot{color:#6b6560;font-size:10px;margin-top:18px;text-align:right}
}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--done);outline-offset:2px}
@media(max-width:480px){.body{padding-left:14px}.c{display:none}}
</style>
</head>

catch(e){alert("This file has no workbench data. Choose a file saved with Save as file or Save data.")}};r.readAsText(file)}
function render(){

h("button",{c:"btn",onclick:function(){var n=prompt("Project name");if(!n)return;var np=mk(n,confirm("Start from the Spring Boot app roadmap?\nOK = use it, Cancel = empty roadmap"));D.projects.push(np);D.cur=np.id;V="overview";save();render()}},"New project"),
h("button",{c:"btn pri",onclick:saveHtml},"Save as file"),
h("button",{c:"btn",onclick:printReport},"Save as PDF"),
h("button",{c:"btn",onclick:function(){dl(fname(".json"),JSON.stringify(D,null,2),"application/json")}},"Save data"),
h("button",{c:"btn",onclick:function(){document.getElementById("file").click()}},"Open file"),
h("select",{c:"th","aria-label":"Theme",onchange:function(){setTheme(this.value)}},[["light","Light"],["monokai","Monokai"]].map(function(t){return h("option",{value:t[0],selected:t[0]===THEME},t[1])}))));

function panel(k){var col=!!fold[k]&&!MAXK,pn=h("section",{c:"pn"+(col?" collapsed":"")}),b=h("div",{c:"pb","data-k":k});

MAXK?null:h("button",{c:"btn","aria-expanded":!col,onclick:function(){fold[k]=!fold[k];render()}},col?"Expand":"Collapse"),

h("div",{c:"meta"},h("span",{},s.d+" of "+s.t+" tasks done"),h("span",{},s.sd+" of "+p.steps.length+" steps complete")),

h("span",{c:"n"},k==="done"?"\u2713":i+1),h("span",{c:"t"},s.t),h("span",{c:"c"},a+" of "+s.tasks.length)));

h("input",{type:"checkbox",checked:!!x.d,onchange:function(){x.d=this.checked?1:0;save();render()}}),
h("span",{onclick:function(){var n=prompt("Edit task",x.t);if(n){x.t=n;save();render()}}},x.t),
h("button",{c:"x","aria-label":"Delete task",onclick:function(){s.tasks.splice(j,1);save();render()}},"\u00d7")))});

h("button",{c:"btn",onclick:function(){var n=prompt("New task");if(n){s.tasks.push({t:n,d:0});open[p.id+i]=1;save();render()}}},"Add task"),
h("button",{c:"btn",onclick:function(){var n=prompt("Rename step",s.t);if(n){s.t=n;save();render()}}},"Rename step"),
h("button",{c:"btn",disabled:i===0,onclick:function(){p.steps.splice(i-1,0,p.steps.splice(i,1)[0]);save();render()}},"Move up"),

app.append(h("div",{c:"acts"},h("button",{c:"btn pri",onclick:function(){var n=prompt("Step name");if(n){p.steps.push({t:n,tasks:[]});open[p.id+(p.steps.length-1)]=1;save();render()}}},"Add step"),
h("button",{c:"btn",onclick:function(){var all=p.steps.every(function(_,i){return open[p.id+i]});p.steps.forEach(function(_,i){open[p.id+i]=!all});render()}},"Expand or collapse all"),
h("button",{c:"btn",onclick:function(){if(confirm("Clear every tick in this project?")){p.steps.forEach(function(s){s.tasks.forEach(function(x){x.d=0})});save();render()}}},"Reset progress")))}
function vResearch(app,p){
